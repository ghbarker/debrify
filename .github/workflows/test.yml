name: Test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install native test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libsqlite3-0

      - name: Test CI allowlist matcher
        run: python3 -m unittest ci_test_allowlist_test.py
        working-directory: tool

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Scoped to the new port/tests. God files still have pre-existing
      # infos/warnings; do not fail the job on those (see test/BASELINE_FAILURES.md).
      - name: Analyze refactor surface
        run: flutter analyze
          lib/services/cloud
          lib/services/storage
          lib/widgets/debrid_loading_overlay.dart
          lib/widgets/cloud_provider_chrome.dart
          lib/screens/cloud/cloud_browse_select_source.dart
          test/adversarial
          test/support
          test/cloud_playback_characterization_test.dart
          test/cloud_playlist_and_chrome_test.dart
          test/cloud_native_bound_test.dart
          test/cloud_lazy_entry_url_test.dart
          test/cloud_playback_unlock_test.dart
          test/cloud_player_screen_unlock_test.dart
          test/cloud_stremio_resolve_test.dart
          test/cloud_stremio_available_test.dart
          test/cloud_stremio_resolve_gate_test.dart
          test/cloud_stremio_torbox_cache_test.dart
          test/cloud_stremio_premiumize_cache_test.dart
          test/cloud_stremio_cache_filter_test.dart
          test/cloud_playback_cache_first_test.dart
          test/cloud_zip_permalink_test.dart
          test/cloud_premiumize_transfer_test.dart
          test/cloud_premiumize_zip_test.dart
          test/cloud_queue_uncached_test.dart
          test/cloud_magic_tv_prepare_test.dart
          test/cloud_magic_tv_locked_links_test.dart
          test/cloud_magic_tv_provider_test.dart
          test/cloud_unlock_plan_test.dart
          test/cloud_port_feature_test.dart
          test/download_cloud_credential_key_test.dart

      - name: Run refactor contract tests
        run: flutter test
          test/adversarial
          test/cloud_playback_characterization_test.dart
          test/cloud_playlist_and_chrome_test.dart
          test/cloud_native_bound_test.dart
          test/cloud_lazy_entry_url_test.dart
          test/cloud_playback_unlock_test.dart
          test/cloud_player_screen_unlock_test.dart
          test/cloud_stremio_resolve_test.dart
          test/cloud_stremio_available_test.dart
          test/cloud_stremio_resolve_gate_test.dart
          test/cloud_stremio_torbox_cache_test.dart
          test/cloud_stremio_premiumize_cache_test.dart
          test/cloud_stremio_cache_filter_test.dart
          test/cloud_playback_cache_first_test.dart
          test/cloud_zip_permalink_test.dart
          test/cloud_premiumize_transfer_test.dart
          test/cloud_premiumize_zip_test.dart
          test/cloud_queue_uncached_test.dart
          test/cloud_magic_tv_prepare_test.dart
          test/cloud_magic_tv_locked_links_test.dart
          test/cloud_magic_tv_provider_test.dart
          test/cloud_unlock_plan_test.dart
          test/cloud_port_feature_test.dart
          test/download_cloud_credential_key_test.dart
          --reporter compact

      # Full suite minus pixel goldens. Historical Linux failures are listed
      # in test/BASELINE_ALLOWLIST.txt; only new failures fail the job.
      - name: Run app tests against baseline allowlist
        run: python3 tool/ci_test_allowlist.py
